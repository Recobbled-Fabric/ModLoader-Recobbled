plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

group = project.property('group')
version = project.property('version')
base.archivesName = project.property('modname')

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

repositories {
    mavenLocal()
    mavenCentral()
    unimined.modrinthMaven()
    maven {
        url = "https://maven.wagyourtail.xyz/releases"
    }
    maven {
        url = "https://maven.wagyourtail.xyz/snapshots"
    }
    maven {
        url = "https://maven.glass-launcher.net/babric/"
    }
    flatDir {
        dirs 'custom_jar'
    }
}

unimined {
    useGlobalCache = false

    minecraft {
        version 'b1.7.3'
        side "client"

        mappings {
            retroMCP("b1.7")
            devNamespace("retroMCP")
            stubs(['official', 'retroMCP']) {
                def base = 'net/minecraft/src'
                def mapClass = { name ->
                    def path = "$base/$name"
                    c(name, path, path)
                }

                jarClasses('custom_jar/modloader-recobbled-1.6.jar').each(mapClass)
                jarClasses('custom_jar/recobbled-1.6_03.jar').each(mapClass)
                ["PlayerAPI", "PlayerBase"].each(mapClass)
            }
        }

        MinecraftProvider minecraftProvider = delegate as MinecraftProvider

        merged {
            customPatcher(new FabricWithoutIntermediary(project, minecraftProvider)) {
                it.loader '0.19.5'
                it.accessWidener(project.file("src/main/resources/modloadermp.accessWidener"))
            }
            jarMod {
                enableJarModAgent = false
            }
        }
    }
}

dependencies {
    jarMod name: "recobbled", version: "1.6_03"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

import xyz.wagyourtail.unimined.api.minecraft.task.RemapJarTask
import xyz.wagyourtail.unimined.internal.minecraft.patch.fabric.OfficialFabricMinecraftTransformer
import xyz.wagyourtail.unimined.api.runs.RunConfig
import xyz.wagyourtail.unimined.internal.minecraft.MinecraftProvider

import java.util.zip.ZipFile

tasks.withType(RemapJarTask).configureEach {
    mixinRemap {
        enableBaseMixin()
        enableMixinExtra()
    }

    doLast {
        def jarFile = archiveFile.get().asFile

        def tempFile = new File(
                temporaryDir,
                jarFile.name + ".tmp"
        )

        def awPath = "modloadermp.accessWidener"

        def input = new java.util.zip.ZipFile(jarFile)
        def output = new java.util.zip.ZipOutputStream(
                new java.io.FileOutputStream(tempFile)
        )

        try {
            input.entries().each { entry ->
                def bytes = input.getInputStream(entry).bytes

                if (entry.name == awPath) {
                    def text = new String(bytes, "UTF-8")

                    //System.out.println(text)
                    text = text.replaceFirst(
                            "intermediary",
                            "official"
                    )


                    bytes = text.getBytes("UTF-8")
                }

                def newEntry = new java.util.zip.ZipEntry(entry.name)

                newEntry.time = entry.time
                newEntry.method = entry.method

                output.putNextEntry(newEntry)
                output.write(bytes)
                output.closeEntry()
            }
        } finally {
            output.close()
            input.close()
        }

        if (!jarFile.delete()) {
            throw new GradleException(
                    "Could not replace remapped jar: ${jarFile}"
            )
        }

        if (!tempFile.renameTo(jarFile)) {
            throw new GradleException(
                    "Could not rename temporary jar to: ${jarFile}"
            )
        }
    }
}

def jarClasses(String jarPath) {
    def file = file(jarPath)
    def zip = new ZipFile(file)
    def names = []
    zip.entries().each { entry ->
        if (entry.name.endsWith('.class') && !entry.name.contains('/')) {
            def name = entry.name - '.class'
            if (name.size() > 2) names << name
        }
    }
    zip.close()
    return names
}

class FabricWithoutIntermediary extends OfficialFabricMinecraftTransformer{

    FabricWithoutIntermediary(Project project, MinecraftProvider provider) {
        super(project, provider)
        customIntermediaries = true
        prodNamespace("official")
    }

    @Override
    void applyRunTransform(RunConfig config) {
        super.applyRunTransform(config)
        config.jvmArgs("-Dfabric.gameVersion=${provider.version}")
    }

    @Override
    java.nio.file.Path getDevMappings() {
        return null;
    }

}